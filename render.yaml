services:
  # Main web service
  - type: web
    name: fake-news-detection
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production

  # Background worker service
  - type: worker
    name: keep-alive-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python keep_alive.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
